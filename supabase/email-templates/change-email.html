<!-- IX (2026-11-26): branded Supabase Auth email - paste into Supabase -> Authentication -> Email templates -> Change email address. Subject: "Confirm your new Formtrace email" -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F1EA;padding:24px 0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:14px;overflow:hidden">
      <tr><td style="background:#0B0E11"><img src="https://formtrace.ie/img/email-header.png" width="600" alt="Formtrace" style="display:block;width:100%;max-width:600px;height:auto;border:0"></td></tr>
      <tr><td style="padding:36px 40px 8px;text-align:center">
        <h1 style="margin:0 0 12px;font-size:26px;line-height:1.25;color:#0B0E11;font-weight:700">Confirm your new email</h1>
        <p style="margin:0 0 28px;font-size:15px;line-height:1.55;color:#5B6470">Tap the button to move your Formtrace account to this address.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#E8B923;color:#0B0E11;text-decoration:none;font-weight:700;font-size:16px;padding:14px 42px;border-radius:999px">Confirm new email</a>
        <p style="margin:24px 0 0;font-size:12.5px;line-height:1.5;color:#8A929C">If you didn't ask for this change, ignore this email and your address stays the same.</p>
      </td></tr>
      <tr><td style="padding:24px 40px 28px;text-align:center;border-top:1px solid #EEE9DF;font-size:12px;color:#8A929C">Formtrace · formtrace.ie</td></tr>
    </table>
  </td></tr>
</table>
